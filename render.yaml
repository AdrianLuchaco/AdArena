# =====================================================================
# Render "Blueprint": crea el BACKEND de LaunchCrown en Render con el plan gratuito.
#
# En Render: New → Blueprint → elige este repositorio. Render lee este archivo y te pide los
# valores marcados con "sync: false" (los tienes explicados en docs/DESPLIEGUE.md).
#
# Plan gratuito: 512 MB de memoria y 0,1 CPU. Se "duerme" tras 15 min sin visitas: por eso en la
# guía se configura UptimeRobot (gratis) para que lo visite cada 5 minutos y el cierre de
# medianoche se haga siempre a su hora.
# =====================================================================
services:
  - type: web
    name: adarena-api
    runtime: docker
    plan: free
    # Fráncfort: el más cercano a España (y la base de datos de Supabase también va en Fráncfort)
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # --- Base de datos (Supabase → Connect → Session pooler) ---
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # El pooler gratuito de Supabase admite pocas conexiones: 5 es de sobra para LaunchCrown
      - key: DB_POOL_SIZE
        value: "5"

      # --- Seguridad ---
      # Render genera uno aleatorio (256 bits) la primera vez
      - key: JWT_SECRET
        generateValue: true
      # La MISMA clave que pondrás en Vercel (openssl rand -hex 32)
      - key: PROXY_SECRET
        sync: false
      # La dirección de la web en Vercel, p. ej. https://adarena.vercel.app (sin barra final)
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false

      # --- Tu cuenta de administrador (se crea en el primer arranque) ---
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin

      # --- Emails con Brevo (gratis, 300 al día) ---
      - key: BREVO_API_KEY
        sync: false
      # "LaunchCrown <tu-email-verificado-en-brevo@gmail.com>"
      - key: MAIL_FROM
        sync: false
