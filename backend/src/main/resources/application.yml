spring:
  application:
    name: publifi

  # Valores por defecto para desarrollo local (docker-compose, fase 2).
  # En producción se sobrescriben con variables de entorno.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/publifi}
    username: ${DB_USERNAME:publifi}
    password: ${DB_PASSWORD:publifi}

  jpa:
    # Nunca dejamos la sesión de BD abierta durante el renderizado de la respuesta.
    open-in-view: false
    hibernate:
      # Flyway es el dueño del esquema; Hibernate solo comprueba que las entidades encajan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
