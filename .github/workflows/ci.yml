# Comprobaciones automáticas en GitHub (gratis): en cada subida a main y en cada pull request se
# ejecutan los tests del backend (con PostgreSQL de verdad en Docker) y se compila la web.
# Si algo falla, lo verás en la pestaña "Actions" de GitHub con una ✗ roja.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: este flujo no necesita cambiar nada del repositorio
permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  frontend:
    name: Web (lint y build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /
          NEXT_PUBLIC_WS_URL: wss://example.onrender.com/ws
